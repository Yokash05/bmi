
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .mobile-card {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }


        .form-control {
            height: 52px;
            border-radius: 12px;
            background: #f7f8fc;
            border: 1px solid #e1e4ed;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #667eea;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            height: 52px;
            border-radius: 12px;
            font-weight: bold;
            border: none;
        }

        .btn-calculate:hover {
            color:white;
            opacity: 0.9;
            
        }

        .result-box {
            background: #f5f6ff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 25px;
            display: none;
        }
        .result-box:hover{
            color: green;
            

        }

        #demo {
            color: #667eea;
            font-size: 35px;
            font-weight: bold;
        }

        #dem {
            font-size: 18px;
            font-weight: bold;
        }

        .footer-text {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="mobile-card">

        <div class="text-center mb-4">

           
        

            <h3 class="fw-bold">BMI Calculator</h3>

            <p class="text-secondary">
                Calculate your Body Mass Index
            </p>

        </div>

        <script>

            function bmi() {

                let height = Number(document.getElementById("h1").value);
                let weight = Number(document.getElementById("w1").value);

                if (height <= 0 || weight <= 0 ||
                    !Number.isFinite(height) ||
                    !Number.isFinite(weight)) {

                    alert("Please enter valid height and weight");
                    return;
                }

                let bmi = weight / (height * height) * 10000;

                document.getElementById("demo").textContent =
                    bmi.toFixed(2);

                let category = "";

                if (bmi < 18.5) {
                    category = "Underweight";
                }
                else if (bmi < 25) {
                    category = "Normal Weight";
                }
                else if (bmi < 30) {
                    category = "Overweight";
                }
                else {
                    category = "Obese";
                }

                document.getElementById("dem").textContent = category;

                document.getElementById("result").style.display = "block";
            }

        </script>

        <div class="mb-3">

            <label class="form-label fw-semibold">
                Height (cm)
            </label>

            <input type="number"
                   placeholder="Enter your height"
                   id="h1"
                   class="form-control"
                   min="1"
                   step="any"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label fw-semibold">
                Weight (kg)
            </label>

            <input type="number"
                   placeholder="Enter your weight"
                   id="w1"
                   class="form-control"
                   min="1"
                   step="any"
                   required>

        </div>

        <div class="d-grid">

            <button type="button"
                    onclick="bmi()"
                    class="btn btn-calculate">
                Calculate BMI →
            </button>

        </div>

        <div class="result-box" id="result">

            <p class="text-secondary mb-1">
                Your BMI Result
            </p>

            <h1 id="demo">0.00</h1>

            <h5 id="dem"></h5>

        </div>

          

    </div>

</body>
</html>
